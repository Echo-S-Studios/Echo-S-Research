# The verification "pipes" (code/) are exact-arithmetic softcheck harnesses, not data
# producers; the drift check just runs each and requires exit 0 (no data/ to diff).
#
# open_tags_resolution_check.py (v2.9, the Door-Traffic Dichotomy + degree 7-10
# within-shell scan) uses python-flint for the companion-power enumeration; per the
# drift workflow's design ("contributions needing other tools self-provision inside
# their own check commands"), the verify step installs it before running pytest.
checks:
  - name: harnesses
    verify: '{PY} -m pip install --quiet --disable-pip-version-check "python-flint==0.9.0" && {PY} -m pytest tests/2026-07-complex-rung-generator -q -p no:cacheprovider'
