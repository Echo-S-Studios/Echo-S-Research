name: drift

# Manifest-driven, domain-agnostic drift detection. For every papers/<sn>/
# contribution.yml, scripts/run_drift.py runs that contribution's declared checks
# (regenerate outputs + diff `produces` against committed; run each `verify`), and
# cleanly SKIPS `checks: none` (pure-theory/prose) work instead of failing it.
#
# Runs on ubuntu (python3/pip). The base scientific stack is pinned to the versions
# that generated the committed data, so the existing math checks reproduce exactly.
# Contributions needing other tools self-provision inside their own check commands
# (adding a member or a paper needs NO edit to this workflow).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    name: run each contribution's declared checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base deps (manifest loader + pinned scientific stack)
        run: python -m pip install --upgrade pip pyyaml "sympy==1.14.0" "mpmath==1.3.0" "numpy==2.4.6" pytest

      - name: Run manifest-driven drift check
        run: python scripts/run_drift.py
